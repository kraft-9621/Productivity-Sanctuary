<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Sanctuary</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sanctuary: {
              bg: '#090d16',
              card: '#111827',
              border: '#1f2937',
              accent: '#6366f1',
              accentHover: '#4f46e5'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['Fira Code', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #090d16;
      color: #f3f4f6;
    }

    /* Custom range slider aesthetic */
    input[type=range] {
      -webkit-appearance: none;
      background: #1f2937;
      height: 4px;
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #818cf8;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(17, 24, 39, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }

    /* SVG Progress Ring stroke transition */
    .progress-ring-circle {
      transition: stroke-dashoffset 0.35s ease-in-out;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 antialiased overflow-x-hidden">

  <!-- TOP HEADER -->
  <header class="w-full border-b border-slate-800/60 bg-slate-900/40 backdrop-blur-md px-6 py-4 flex items-center justify-between z-10 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold text-sm">
        ⛩️
      </div>
      <div>
        <h1 class="text-sm font-semibold tracking-wide text-slate-200">PRODUCTIVITY SANCTUARY</h1>
        <p class="text-[10px] text-slate-500 tracking-wider uppercase">Offline Minimalist Workspace</p>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-4 text-xs">
      <div id="save-indicator" class="flex items-center gap-1.5 text-slate-500 transition-opacity duration-300">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[11px] font-mono">Saved locally</span>
      </div>
    </div>
  </header>

  <!-- MAIN DASHBOARD GRID -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start overflow-y-auto">

    <!-- LEFT COLUMN: Soundscapes + Timer + Tasks (Lg: 5 Cols) -->
    <div class="lg:col-span-5 flex flex-col gap-6 w-full">

      <!-- 1. POMODORO FOCUS CONTROLLER -->
      <section class="bg-slate-900/50 border border-slate-800/80 rounded-xl p-5 backdrop-blur-sm shadow-xl">
        <div class="flex items-center justify-between mb-4">
          <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase flex items-center gap-2">
            <span>⏱️</span> Focus Timer
          </span>
          <div class="flex gap-1 bg-slate-950/60 p-1 rounded-lg border border-slate-800">
            <button onclick="setTimerMode('focus')" id="mode-focus" class="px-2.5 py-1 text-[11px] font-medium rounded-md transition-colors bg-indigo-600 text-white">Focus</button>
            <button onclick="setTimerMode('short')" id="mode-short" class="px-2.5 py-1 text-[11px] font-medium rounded-md text-slate-400 hover:text-slate-200 transition-colors">Short Break</button>
            <button onclick="setTimerMode('long')" id="mode-long" class="px-2.5 py-1 text-[11px] font-medium rounded-md text-slate-400 hover:text-slate-200 transition-colors">Long Break</button>
          </div>
        </div>

        <div class="flex flex-col items-center justify-center my-2 relative">
          <!-- Circular SVG Progress -->
          <svg class="w-48 h-48">
            <circle class="text-slate-800" stroke-width="6" stroke="currentColor" fill="transparent" r="82" cx="96" cy="96"/>
            <circle id="timer-progress" class="progress-ring-circle text-indigo-500" stroke-width="6" stroke-dasharray="515.2" stroke-dashoffset="0" stroke-linecap="round" stroke="currentColor" fill="transparent" r="82" cx="96" cy="96"/>
          </svg>
          
          <!-- Timer Readout Inside Circle -->
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span id="timer-display" class="font-mono text-4xl font-bold tracking-tighter text-slate-100">25:00</span>
            <span id="timer-label" class="text-[11px] text-slate-500 font-medium uppercase mt-1 tracking-widest">Focus Session</span>
          </div>
        </div>

        <!-- Timer Controls -->
        <div class="flex items-center justify-center gap-3 mt-4">
          <button id="timer-toggle-btn" onclick="toggleTimer()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs rounded-lg transition-all shadow-lg shadow-indigo-600/20 active:scale-95">
            Start Focus
          </button>
          <button onclick="resetTimer()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-xs rounded-lg transition-colors active:scale-95">
            Reset
          </button>
        </div>
      </section>

      <!-- 2. WEB AUDIO SYNTHESIZER BOARD -->
      <section class="bg-slate-900/50 border border-slate-800/80 rounded-xl p-5 backdrop-blur-sm shadow-xl">
        <div class="flex items-center justify-between mb-4">
          <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase flex items-center gap-2">
            <span>🎧</span> Ambient Synthesizer
          </span>
          <span class="text-[10px] text-indigo-400 font-mono bg-indigo-950/60 border border-indigo-800/40 px-2 py-0.5 rounded">Pure WebAudio</span>
        </div>

        <div class="space-y-4">
          <!-- Track 1: Soft Rain Synth -->
          <div class="bg-slate-950/40 border border-slate-800/60 p-3 rounded-lg flex items-center gap-3">
            <button id="btn-rain" onclick="toggleSound('rain')" class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-sm shrink-0 transition-colors">
              🌧️
            </button>
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-medium text-slate-200 truncate">Soft Rain</span>
                <span id="val-rain" class="text-[10px] font-mono text-slate-500">0%</span>
              </div>
              <input type="range" id="vol-rain" min="0" max="1" step="0.01" value="0.3" oninput="updateVolume('rain', this.value)" class="w-full">
            </div>
          </div>

          <!-- Track 2: White Noise Generator -->
          <div class="bg-slate-950/40 border border-slate-800/60 p-3 rounded-lg flex items-center gap-3">
            <button id="btn-white" onclick="toggleSound('white')" class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-sm shrink-0 transition-colors">
              📻
            </button>
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-medium text-slate-200 truncate">White Noise</span>
                <span id="val-white" class="text-[10px] font-mono text-slate-500">0%</span>
              </div>
              <input type="range" id="vol-white" min="0" max="1" step="0.01" value="0.3" oninput="updateVolume('white', this.value)" class="w-full">
            </div>
          </div>

          <!-- Track 3: Binaural Deep Drone -->
          <div class="bg-slate-950/40 border border-slate-800/60 p-3 rounded-lg flex items-center gap-3">
            <button id="btn-drone" onclick="toggleSound('drone')" class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-sm shrink-0 transition-colors">
              🧘
            </button>
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-medium text-slate-200 truncate">Deep Focus Drone</span>
                <span id="val-drone" class="text-[10px] font-mono text-slate-500">0%</span>
              </div>
              <input type="range" id="vol-drone" min="0" max="1" step="0.01" value="0.3" oninput="updateVolume('drone', this.value)" class="w-full">
            </div>
          </div>
        </div>
      </section>

      <!-- 3. TRANSIENT TASK TRACKER -->
      <section class="bg-slate-900/50 border border-slate-800/80 rounded-xl p-5 backdrop-blur-sm shadow-xl">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase flex items-center gap-2">
            <span>⚡</span> Transient Tasks
          </span>
          <button onclick="clearCompletedTasks()" class="text-[11px] text-slate-500 hover:text-slate-300 transition-colors">
            Clear Completed
          </button>
        </div>

        <!-- Task Input Box -->
        <form onsubmit="handleAddTask(event)" class="flex gap-2 mb-3">
          <input type="text" id="task-input" placeholder="Type a quick action items & press Enter..." class="flex-1 bg-slate-950/80 border border-slate-800 focus:border-indigo-500 text-xs text-slate-200 px-3 py-2 rounded-lg outline-none transition-colors">
          <button type="submit" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs rounded-lg transition-colors shrink-0">
            Add
          </button>
        </form>

        <!-- Task Badges Queue -->
        <div id="task-list" class="flex flex-wrap gap-2 max-h-48 overflow-y-auto p-1">
          <!-- Dynamic Task items inserted here -->
        </div>
      </section>

    </div>

    <!-- RIGHT COLUMN: Distraction-Free Workspace Notepad (Lg: 7 Cols) -->
    <div class="lg:col-span-7 w-full h-[640px] flex flex-col bg-slate-900/50 border border-slate-800/80 rounded-xl p-5 backdrop-blur-sm shadow-xl">
      <!-- Toolbar Header -->
      <div class="flex flex-wrap items-center justify-between gap-3 mb-3 pb-3 border-b border-slate-800/80">
        <div class="flex items-center gap-2">
          <span>📝</span>
          <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Local Workspace Notepad</span>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="downloadNote()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg flex items-center gap-1.5 transition-colors">
            <span>📥</span> Download
          </button>
          <button onclick="clearNote()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-rose-950/50 hover:text-rose-300 text-slate-400 text-xs font-medium rounded-lg flex items-center gap-1.5 transition-colors border border-transparent hover:border-rose-800/40">
            <span>🗑️</span> Clear
          </button>
        </div>
      </div>

      <!-- Markdown Textarea -->
      <textarea id="editor" placeholder="Write thoughts, daily intentions, markdown, or rough drafts here... (auto-saves to local storage)" class="w-full flex-1 bg-transparent text-slate-200 font-mono text-xs leading-relaxed outline-none resize-none p-1 placeholder-slate-600"></textarea>

      <!-- Footer Info Stats -->
      <div class="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500 font-mono">
        <div class="flex gap-4">
          <span id="stat-words">0 words</span>
          <span id="stat-chars">0 characters</span>
        </div>
        <div>
          <span>Markdown Supported</span>
        </div>
      </div>
    </div>

  </main>

  <!-- JAVASCRIPT LOGIC ENGINE -->
  <script>
    // ==========================================
    // 1. WEB AUDIO SYNTHESIZER ENGINE
    // ==========================================
    let audioCtx = null;
    
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    const soundNodes = {
      rain: { active: false, gain: null, node: null, vol: 0.3 },
      white: { active: false, gain: null, node: null, vol: 0.3 },
      drone: { active: false, gain: null, osc1: null, osc2: null, vol: 0.3 }
    };

    // Synthesize White Noise Node
    function createWhiteNoiseNode(ctx) {
      const bufferSize = ctx.sampleRate * 2;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = ctx.createBufferSource();
      whiteNoise.buffer = buffer;
      whiteNoise.loop = true;
      return whiteNoise;
    }

    // Synthesize Soft Rain (Filtered Pink Noise with Modulation LFO)
    function startRainSynth() {
      const ctx = getAudioContext();
      const noise = createWhiteNoiseNode(ctx);

      // Lowpass Filter for soft muffled tone
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 800;

      // LFO for periodic rain swells
      const lfo = ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.2; // slow pulse

      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 300;

      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      const gain = ctx.createGain();
      gain.gain.value = soundNodes.rain.vol;

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      noise.start();
      lfo.start();

      soundNodes.rain.node = noise;
      soundNodes.rain.gain = gain;
    }

    // Synthesize White Noise
    function startWhiteNoiseSynth() {
      const ctx = getAudioContext();
      const noise = createWhiteNoiseNode(ctx);

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 3000;

      const gain = ctx.createGain();
      gain.gain.value = soundNodes.white.vol;

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      noise.start();

      soundNodes.white.node = noise;
      soundNodes.white.gain = gain;
    }

    // Synthesize Deep Binaural Drone (Dual Sine Waves)
    function startDroneSynth() {
      const ctx = getAudioContext();

      // Osc 1: Base low tone (110 Hz - A2)
      const osc1 = ctx.createOscillator();
      osc1.type = 'sine';
      osc1.frequency.value = 110;

      // Osc 2: Slight offset for binaural beat beatings (114 Hz)
      const osc2 = ctx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.value = 114;

      const gain = ctx.createGain();
      gain.gain.value = soundNodes.drone.vol * 0.4; // lower amplitude for smooth bass

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);

      osc1.start();
      osc2.start();

      soundNodes.drone.osc1 = osc1;
      soundNodes.drone.osc2 = osc2;
      soundNodes.drone.gain = gain;
    }

    function toggleSound(type) {
      getAudioContext();
      const sound = soundNodes[type];
      const btn = document.getElementById(`btn-${type}`);
      const valSpan = document.getElementById(`val-${type}`);

      if (!sound.active) {
        sound.active = true;
        btn.classList.remove('bg-slate-800', 'text-slate-300');
        btn.classList.add('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-600/30');
        valSpan.innerText = `${Math.round(sound.vol * 100)}%`;

        if (type === 'rain') startRainSynth();
        if (type === 'white') startWhiteNoiseSynth();
        if (type === 'drone') startDroneSynth();
      } else {
        sound.active = false;
        btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-600/30');
        btn.classList.add('bg-slate-800', 'text-slate-300');
        valSpan.innerText = '0%';

        if (sound.gain) sound.gain.gain.setValueAtTime(0, audioCtx.currentTime);
        if (sound.node) sound.node.stop();
        if (sound.osc1) sound.osc1.stop();
        if (sound.osc2) sound.osc2.stop();
      }
    }

    function updateVolume(type, val) {
      soundNodes[type].vol = parseFloat(val);
      const valSpan = document.getElementById(`val-${type}`);
      if (soundNodes[type].active) {
        valSpan.innerText = `${Math.round(val * 100)}%`;
        if (soundNodes[type].gain) {
          const actualGain = type === 'drone' ? val * 0.4 : val;
          soundNodes[type].gain.gain.setValueAtTime(actualGain, audioCtx.currentTime);
        }
      }
    }

    // Synthesize Timer Alarm Bell Sound
    function playAlarmChime() {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3); // A5

      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.8);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 1.8);
    }

    // ==========================================
    // 2. POMODORO FOCUS CONTROLLER ENGINE
    // ==========================================
    const timerModes = {
      focus: { name: 'Focus Session', minutes: 25 },
      short: { name: 'Short Break', minutes: 5 },
      long: { name: 'Long Break', minutes: 15 }
    };

    let currentMode = 'focus';
    let timeLeft = 25 * 60;
    let totalTime = 25 * 60;
    let timerInterval = null;
    let isTimerRunning = false;

    const timerDisplay = document.getElementById('timer-display');
    const timerLabel = document.getElementById('timer-label');
    const timerProgress = document.getElementById('timer-progress');
    const timerToggleBtn = document.getElementById('timer-toggle-btn');
    const circleRadius = 82;
    const circumference = 2 * Math.PI * circleRadius;

    function setTimerMode(mode) {
      currentMode = mode;
      totalTime = timerModes[mode].minutes * 60;
      timeLeft = totalTime;

      ['focus', 'short', 'long'].forEach(m => {
        const btn = document.getElementById(`mode-${m}`);
        if (m === mode) {
          btn.classList.add('bg-indigo-600', 'text-white');
          btn.classList.remove('text-slate-400');
        } else {
          btn.classList.remove('bg-indigo-600', 'text-white');
          btn.classList.add('text-slate-400');
        }
      });

      timerLabel.innerText = timerModes[mode].name;
      pauseTimer();
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      const formatted = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      timerDisplay.innerText = formatted;
      document.title = `(${formatted}) Productivity Sanctuary`;

      // Update SVG Circle Offset
      const offset = circumference - (timeLeft / totalTime) * circumference;
      timerProgress.style.strokeDashoffset = offset;
    }

    function toggleTimer() {
      if (isTimerRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      getAudioContext();
      isTimerRunning = true;
      timerToggleBtn.innerText = 'Pause Focus';
      timerToggleBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
      timerToggleBtn.classList.add('bg-amber-600', 'hover:bg-amber-500');

      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateTimerDisplay();
        } else {
          pauseTimer();
          playAlarmChime();
          alert(`Timer finished! Time for your next cycle.`);
          resetTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      isTimerRunning = false;
      clearInterval(timerInterval);
      timerToggleBtn.innerText = 'Start Focus';
      timerToggleBtn.classList.remove('bg-amber-600', 'hover:bg-amber-500');
      timerToggleBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-500');
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = totalTime;
      updateTimerDisplay();
    }

    // ==========================================
    // 3. TRANSIENT TASK TRACKER ENGINE
    // ==========================================
    let tasks = JSON.parse(localStorage.getItem('sanctuary_tasks')) || [
      { id: 1, text: 'Brainstorm architectural goals', completed: false },
      { id: 2, text: 'Review deep focus notes', completed: true }
    ];

    function saveTasks() {
      localStorage.setItem('sanctuary_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function handleAddTask(e) {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;

      tasks.push({ id: Date.now(), text, completed: false });
      input.value = '';
      saveTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTasks();
    }

    function clearCompletedTasks() {
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
    }

    function renderTasks() {
      const container = document.getElementById('task-list');
      container.innerHTML = '';

      if (tasks.length === 0) {
        container.innerHTML = `<span class="text-[11px] text-slate-600 italic">No transient tasks queued.</span>`;
        return;
      }

      tasks.forEach(t => {
        const badge = document.createElement('div');
        badge.onclick = () => toggleTask(t.id);
        badge.className = `cursor-pointer px-3 py-1.5 rounded-lg text-xs font-medium border flex items-center gap-2 transition-all ${
          t.completed 
            ? 'bg-slate-950/40 border-slate-800/40 text-slate-600 line-through' 
            : 'bg-slate-800/80 border-slate-700/60 text-slate-200 hover:border-indigo-500/50'
        }`;
        badge.innerHTML = `
          <span>${t.completed ? '✓' : '•'}</span>
          <span>${escapeHtml(t.text)}</span>
        `;
        container.appendChild(badge);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ==========================================
    // 4. LOCAL STORAGE WORKSPACE ENGINE
    // ==========================================
    const editor = document.getElementById('editor');
    const statWords = document.getElementById('stat-words');
    const statChars = document.getElementById('stat-chars');
    const saveIndicator = document.getElementById('save-indicator');
    let debounceTimer = null;

    // Load initial note
    editor.value = localStorage.getItem('sanctuary_note') || `# Productivity Sanctuary Workspace\n\nWelcome to your offline workspace. \n\n- Write notes freely\n- Synthesize ambient soundscapes on the left\n- Keep focus with the Pomodoro timer`;
    updateTextStats();

    editor.addEventListener('input', () => {
      updateTextStats();
      saveIndicator.style.opacity = '0.3';

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        localStorage.setItem('sanctuary_note', editor.value);
        saveIndicator.style.opacity = '1';
      }, 500);
    });

    function updateTextStats() {
      const text = editor.value;
      const chars = text.length;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      statChars.innerText = `${chars} characters`;
      statWords.innerText = `${words} words`;
    }

    function downloadNote() {
      const blob = new Blob([editor.value], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `sanctuary-note-${new Date().toISOString().slice(0,10)}.md`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearNote() {
      if (confirm('Are you sure you want to clear your current workspace notes?')) {
        editor.value = '';
        localStorage.removeItem('sanctuary_note');
        updateTextStats();
      }
    }

    // Initialize UI State
    renderTasks();
    updateTimerDisplay();
  </script>
</body>
</html>
